spring.application.name=iam

# Actuator: 필요한 엔드포인트만 명시적으로 노출
management.endpoints.web.exposure.include=health,info
management.endpoints.web.exposure.exclude=env,heapdump,configprops,shutdown,beans,mappings,threaddump

# Actuator 엔드포인트 기본 비활성화 후 필요한 것만 활성화
management.endpoints.enabled-by-default=false
management.endpoint.health.enabled=true
management.endpoint.info.enabled=true

# Health 엔드포인트 상세 정보는 인증된 사용자에게만 노출
management.endpoint.health.show-details=when-authorized